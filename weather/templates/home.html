<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Weather App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; background: #f1f5f9; }
        form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        input { flex: 1; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { padding: 0.6rem 1.2rem; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .weather-card { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .temp { font-size: 2rem; font-weight: bold; color: #0f3d5e; margin: 0.5rem 0; }
        .error { color: #b91c1c; background: #fee2e2; padding: 0.75rem; border-radius: 6px; }
    </style>
</head>
<body>
    <h1>Weather App</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.city }}
        <button type="submit">Search</button>
    </form>

    {% if error_message %}
        <p class="error">{{ error_message }}</p>
    {% endif %}

    {% if weather_data %}
        <div class="weather-card">
            <h2>{{ weather_data.city }}</h2>
            <p class="temp">{{ weather_data.temperature }}°C</p>
            <p>Humidity: {{ weather_data.humidity }}%</p>
            <p>Wind Speed: {{ weather_data.wind }} km/h</p>
        </div>
    {% endif %}
</body>
</html>
